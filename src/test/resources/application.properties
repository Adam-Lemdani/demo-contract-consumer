# Filtered at build time by Maven (Spring Boot parent uses @...@ delimiters).
# The provider stub coordinates come from pom properties so cross-repo CI can
# override the version to match whatever was installed into the runner-local .m2:
#     mvn test -Dprovider.stubs.version=1.0.0-SNAPSHOT
stubrunner.ids=@provider.stubs.groupId@:@provider.stubs.artifactId@:@provider.stubs.version@:stubs
stubrunner.stubs-mode=LOCAL

# Present so the GreetingClient bean can start; tests build their own client
# pointed at the Stub Runner port via StubFinder.
provider.base-url=http://localhost:8080

# Flips the deliberately-breaking demo test on under -Pbreaking-demo.
breaking.demo.enabled=@breaking.demo.enabled@
