name: Verify against provider (receiver)

# Consumer-side receiver for the PROVIDER PR flow.
#
# A provider PR dispatches 'verify-provider-change' here. We check out the
# consumer default branch and the PROVIDER at its exact PR SHA, build the
# provider + stubs into this job's runner-local .m2, run the consumer tests
# with StubsMode.LOCAL against those stubs, then report back onto the provider PR.

on:
  repository_dispatch:
    types: [ verify-provider-change ]
  workflow_dispatch:
    inputs:
      provider_repo:
        description: 'owner/name of the provider repo'
        required: true
      provider_sha:
        description: 'exact provider commit SHA to verify'
        required: true
      provider_pr:
        description: 'provider PR number to report on (0 for none)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: verify-provider-${{ github.event.client_payload.provider_repo || github.event.inputs.provider_repo }}-${{ github.event.client_payload.provider_sha || github.event.inputs.provider_sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate and normalise payload
        id: in
        env:
          P_REPO: ${{ github.event.client_payload.provider_repo || github.event.inputs.provider_repo }}
          P_SHA: ${{ github.event.client_payload.provider_sha || github.event.inputs.provider_sha }}
          P_PR: ${{ github.event.client_payload.provider_pr || github.event.inputs.provider_pr || '0' }}
        run: |
          set -euo pipefail
          [[ "$P_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Bad repo: $P_REPO"; exit 1; }
          [[ "$P_SHA"  =~ ^[0-9a-f]{40}$ ]]                     || { echo "Bad sha: $P_SHA"; exit 1; }
          [[ "$P_PR"   =~ ^[0-9]+$ ]]                           || { echo "Bad pr: $P_PR"; exit 1; }
          echo "provider_repo=$P_REPO" >> "$GITHUB_OUTPUT"
          echo "provider_sha=$P_SHA"   >> "$GITHUB_OUTPUT"
          echo "provider_pr=$P_PR"     >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ steps.in.outputs.provider_repo }}

      - name: Report pending status on provider PR
        if: steps.in.outputs.provider_pr != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT }}
          script: |
            const [owner, repo] = ${{ toJSON(steps.in.outputs.provider_repo) }}.split('/');
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: ${{ toJSON(steps.in.outputs.provider_sha) }},
              state: 'pending', context: 'contract-verification/consumer',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Running consumer tests against this provider commit',
            });

      - name: Checkout consumer (default branch)
        uses: actions/checkout@v4
        with:
          path: consumer

      - name: Checkout provider at exact PR SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.in.outputs.provider_repo }}
          ref: ${{ steps.in.outputs.provider_sha }}
          path: provider

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build provider@SHA stubs to runner-local .m2, run consumer tests
        id: build
        run: |
          set -euo pipefail
          M2="${{ runner.temp }}/m2"
          mvn -B -ntp -f provider/pom.xml clean install -Dmaven.repo.local="$M2"
          PVER=$(mvn -q -N -f provider/pom.xml -Dexec.executable=echo -Dexec.args='${project.version}' org.codehaus.mojo:exec-maven-plugin:3.1.0:exec | tail -1)
          mvn -B -ntp -f consumer/pom.xml test \
            -Dmaven.repo.local="$M2" \
            -Dprovider.stubs.version="$PVER"

      - name: Report result on provider PR
        if: always() && steps.in.outputs.provider_pr != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT }}
          script: |
            const success = ${{ steps.build.outcome == 'success' }};
            const [owner, repo] = ${{ toJSON(steps.in.outputs.provider_repo) }}.split('/');
            const sha = ${{ toJSON(steps.in.outputs.provider_sha) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: success ? 'success' : 'failure',
              context: 'contract-verification/consumer',
              target_url: runUrl,
              description: success ? 'Consumer tests pass against this provider commit'
                                   : 'Consumer tests FAIL against this provider commit',
            });

            const pr = Number(${{ toJSON(steps.in.outputs.provider_pr) }});
            const marker = '<!-- contract-verification:consumer -->';
            const body = `${marker}\n### Contract verification (consumer ${context.repo.owner}/${context.repo.repo})\n` +
              `${success ? '✅ Consumer tests **pass** against this provider commit.' : '❌ Consumer tests **fail** against this provider commit.'}\n\n` +
              `Provider commit \`${sha.substring(0,7)}\` · [Actions run](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
