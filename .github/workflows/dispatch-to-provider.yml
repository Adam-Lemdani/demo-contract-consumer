name: Dispatch to provider (consumer PR)

# When a consumer PR is opened/updated, discover the upstream provider from the
# Spring Cloud Contract stub coordinates and ask the provider repo to verify the
# EXACT consumer PR commit against the provider contract/stubs.
#
# Only dispatches. The real verification runs in the provider's
# "Verify consumer change (receiver)" workflow.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      provider_repo:
        description: 'owner/name of the provider repo (manual fallback)'
        required: false

permissions:
  contents: read

concurrency:
  group: dispatch-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Read provider stub coordinates from pom.xml
        id: coords
        run: |
          GID=$(mvn -q -N -Dexec.executable=echo -Dexec.args='${provider.stubs.groupId}' org.codehaus.mojo:exec-maven-plugin:3.1.0:exec 2>/dev/null | tail -1)
          AID=$(mvn -q -N -Dexec.executable=echo -Dexec.args='${provider.stubs.artifactId}' org.codehaus.mojo:exec-maven-plugin:3.1.0:exec 2>/dev/null | tail -1)
          echo "group_id=$GID"    >> "$GITHUB_OUTPUT"
          echo "artifact_id=$AID" >> "$GITHUB_OUTPUT"
          echo "Provider stub coordinates: $GID:$AID"

      - name: Generate GitHub App token
        id: app-token
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Discover provider and dispatch verification
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT }}
          script: |
            const groupId = ${{ toJSON(steps.coords.outputs.group_id) }};
            const artifactId = ${{ toJSON(steps.coords.outputs.artifact_id) }};
            const consumerSha = context.payload.pull_request
              ? context.payload.pull_request.head.sha : context.sha;
            const consumerPr = context.payload.pull_request
              ? context.payload.pull_request.number : 0;

            // Candidate discovery (automated, not authoritative — see README).
            const candidates = new Set();
            const manual = ${{ toJSON(github.event.inputs.provider_repo) }};
            if (manual) candidates.add(manual);
            const configured = ${{ toJSON(vars.PARTNER_REPO) }};
            if (configured) candidates.add(configured);

            try {
              const q = `"<artifactId>${artifactId}</artifactId>" in:file filename:pom.xml`;
              const res = await github.rest.search.code({ q, per_page: 50 });
              for (const item of res.data.items) candidates.add(item.repository.full_name);
            } catch (e) {
              core.warning(`Code Search failed or unavailable: ${e.message}`);
            }

            // Confirm the candidate actually PRODUCES these coordinates.
            const coordRe = new RegExp(`<artifactId>\\s*${artifactId}\\s*</artifactId>`);
            const confirmed = [];
            for (const full of candidates) {
              const [owner, repo] = full.split('/');
              if (!owner || !repo) continue;
              try {
                const pom = await github.rest.repos.getContent({ owner, repo, path: 'pom.xml' });
                const text = Buffer.from(pom.data.content, 'base64').toString('utf8');
                if (coordRe.test(text)) confirmed.push(full);
              } catch (e) {
                core.info(`Skipping ${full}: cannot read pom.xml (${e.message})`);
              }
            }

            if (confirmed.length === 0) {
              core.warning('No confirmed provider. Nothing to dispatch.');
              return;
            }

            for (const full of confirmed) {
              const [owner, repo] = full.split('/');
              core.info(`Dispatching verify-consumer-change to ${full} @ ${consumerSha}`);
              await github.rest.repos.createDispatchEvent({
                owner, repo,
                event_type: 'verify-consumer-change',
                client_payload: {
                  consumer_repo: context.repo.owner + '/' + context.repo.repo,
                  consumer_sha: consumerSha,
                  consumer_pr: consumerPr,
                },
              });
            }
