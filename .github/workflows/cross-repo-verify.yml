name: Cross-repo verify (consumer PR)

# CONSUMER PR flow, in-repo matrix fan-out.
#
#   discover -> verify (matrix, one job per upstream provider, parallel) -> report
#
# UPSTREAM dependencies are read from src/test/resources/application.yml
# (stubrunner.ids) — the single authoritative declaration also used by Spring
# Cloud Contract Stub Runner. For each upstream provider we resolve its owning
# repo, then in parallel check out the provider default branch, build its stubs
# into a runner-local .m2, and run THIS consumer's changed tests (at the exact
# PR SHA) against them. Results are aggregated into one status + summary comment.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      provider_repo:
        description: 'Verify against a single provider owner/name (manual fallback)'
        required: false

permissions: {}

concurrency:
  group: cross-repo-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    permissions:
      contents: read
    runs-on: [self-hosted, java-runner]
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      providers: ${{ steps.find.outputs.providers }}
      consumer_sha: ${{ steps.ctx.outputs.consumer_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR SHA and upstream coordinates from application.yml
        id: ctx
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "consumer_sha=$SHA" >> "$GITHUB_OUTPUT"
          # Read UPSTREAM stub coordinates from authoritative application.yml.
          # Avoid dynamic tool installation; parse the known ids list shape directly.
          COORDS=$(sed -nE 's/^[[:space:]]*-[[:space:]]*"([^"]+)".*/\1/p' src/test/resources/application.yml \
                    | sed -E 's/^([^:]+):([^:]+):.*/\1:\2/' | sort -u)
          if [ -z "$COORDS" ]; then
            echo "No stubrunner.ids entries found in src/test/resources/application.yml" >&2
            exit 1
          fi
          echo "Upstream coordinates:"; echo "$COORDS"
          # Emit as a space-separated list for the discovery script.
          echo "coords<<EOF" >> "$GITHUB_OUTPUT"; echo "$COORDS" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve + confirm upstream provider repos
        id: find
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT }}
          script: |
            const fs = require('fs');
            const coordsRaw = ${{ toJSON(steps.ctx.outputs.coords) }} || '';
            const coords = coordsRaw.split('\n').map(s => s.trim()).filter(Boolean);
            const repoRe = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;

            const candidates = new Set();
            const owner = context.repo.owner;
            const norm = r => r.includes('/') ? r : `${owner}/${r}`;

            // Tier-3 (preferred): authoritative, audited service graph.
            try {
              const g = JSON.parse(fs.readFileSync('.github/service-graph.json', 'utf8'));
              for (const r of (g.upstreamProviders || [])) candidates.add(norm(r));
              for (const r of ((g.manualOverrides || {}).upstreamProviders || [])) candidates.add(norm(r));
              core.info(`Service graph providers: ${[...candidates].join(', ') || '(none)'}`);
            } catch (e) { core.info(`No service graph (${e.message}); relying on application.yml + search.`); }

            const manual = ${{ toJSON(github.event.inputs.provider_repo) }};
            if (manual) {
              const full = norm(manual);
              if (!repoRe.test(full)) {
                core.setFailed(`Invalid provider_repo input '${manual}'. Expected owner/name.`);
                return;
              }
              if (!full.startsWith(`${owner}/`)) {
                core.setFailed(`provider_repo '${manual}' must be in owner '${owner}'.`);
                return;
              }
              candidates.add(full);
            }
            const configured = ${{ toJSON(vars.PARTNER_REPO) }};
            if (configured) {
              const full = norm(configured);
              if (!repoRe.test(full)) {
                core.warning(`Ignoring invalid PARTNER_REPO value '${configured}'`);
              } else {
                candidates.add(full);
              }
            }

            // For each upstream coordinate, find the repo that PRODUCES it.
            // Code Search is text-based, may lag indexing, and is NOT authoritative.
            for (const c of coords) {
              const artifactId = c.split(':')[1];
              if (!artifactId) continue;
              try {
                const q = `"<artifactId>${artifactId}</artifactId>" in:file filename:pom.xml`;
                const res = await github.rest.search.code({ q, per_page: 50 });
                for (const it of res.data.items) candidates.add(it.repository.full_name);
              } catch (e) { core.warning(`Code Search unavailable: ${e.message}`); }
            }

            // Confirm each candidate actually PRODUCES one of the coordinates.
            const artifactIds = coords.map(c => c.split(':')[1]).filter(Boolean);
            const confirmed = [];
            for (const full of candidates) {
              const [owner, repo] = full.split('/');
              if (!owner || !repo || full === context.repo.owner + '/' + context.repo.repo) continue;
              try {
                const pom = await github.rest.repos.getContent({ owner, repo, path: 'pom.xml' });
                const text = Buffer.from(pom.data.content, 'base64').toString('utf8');
                if (artifactIds.some(a => new RegExp(`<artifactId>\\s*${a}\\s*</artifactId>`).test(text)))
                  confirmed.push(full);
                else core.info(`Skip ${full}: does not produce upstream coordinates`);
              } catch (e) { core.info(`Skip ${full}: ${e.message}`); }
            }
            core.info(`Confirmed providers: ${confirmed.join(', ') || '(none)'}`);
            core.setOutput('providers', JSON.stringify(confirmed));

  verify:
    needs: discover
    if: needs.discover.outputs.providers != '[]' && needs.discover.outputs.providers != ''
    permissions:
      contents: read
    runs-on: [self-hosted, java-runner]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        provider: ${{ fromJson(needs.discover.outputs.providers) }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Coordinated cross-repo changes: if this PR's branch carries a Jira ticket
      # (e.g. SIPP2-30) and the partner repo has a branch containing the SAME
      # ticket, verify against THAT branch instead of the partner's default
      # branch. This lets a consumer PR and its matching provider change verify
      # against each other. Ambiguity (>1 matching branch) fails deliberately —
      # one ticket must map to one branch per repo.
      - name: Resolve provider ref (ticket-matched branch or default)
        id: partner
        uses: actions/github-script@v7
        env:
          PARTNER: ${{ matrix.provider }}
          HEAD_REF: ${{ github.head_ref }}
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT || github.token }}
          script: |
            const partner = process.env.PARTNER;
            const headRef = process.env.HEAD_REF || '';
            const [owner, repo] = partner.split('/');
            const meta = await github.rest.repos.get({ owner, repo });
            let ref = meta.data.default_branch;
            let matched = '';
            const tickets = [...new Set((headRef.match(/[A-Z][A-Z0-9]+-\d+/g) || []))];
            if (tickets.length === 1) {
              const ticket = tickets[0];
              const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
              const hits = branches.filter(b => b.name.toUpperCase().includes(ticket));
              if (hits.length > 1) {
                core.setFailed(`Ambiguous: ticket ${ticket} matches ${hits.length} branches in ${partner} `
                  + `(${hits.map(h => h.name).join(', ')}). One ticket must map to one branch per repo.`);
                return;
              }
              if (hits.length === 1) { ref = hits[0].name; matched = hits[0].name; }
            } else if (tickets.length > 1) {
              core.info(`Head branch has multiple tickets (${tickets.join(', ')}); using ${partner} default branch.`);
            }
            core.setOutput('ref', ref);
            core.setOutput('matched', matched ? 'true' : 'false');
            core.info(`Partner ${partner} -> ${ref}${matched ? ' (ticket-matched)' : ' (default branch)'}`);

      - name: Checkout consumer at PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.consumer_sha }}
          fetch-depth: 1
          path: consumer
          persist-credentials: false

      - name: Checkout provider (ticket-matched branch or default)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.provider }}
          ref: ${{ steps.partner.outputs.ref }}
          token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT || github.token }}
          fetch-depth: 1
          path: provider
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build provider stubs (runner-local .m2) + run consumer PR tests
        id: run
        continue-on-error: true
        run: |
          set -euo pipefail
          M2="${{ runner.temp }}/m2"
          # Dependency (provider) only needs its stub jar installed into the
          # runner-local .m2 — NOT its full test suite. -DskipTests still runs
          # package (which builds+attaches the stubs) but skips provider tests.
          mvn -B -ntp -f provider/pom.xml clean install -DskipTests -Dmaven.repo.local="$M2"
          PVER=$(mvn -q -N -f provider/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -ntp -f consumer/pom.xml test -Dmaven.repo.local="$M2" -Dprovider.stubs.version="$PVER"

      - name: Record result
        if: always()
        run: |
          mkdir -p results
          SAFE=$(echo "${{ matrix.provider }}" | tr '/' '_')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '{"repo":"%s","outcome":"%s","job_url":"%s","ref":"%s","matched":%s}\n' \
            "${{ matrix.provider }}" "${{ steps.run.outcome }}" "$RUN/job/${{ github.job }}" \
            "${{ steps.partner.outputs.ref }}" "${{ steps.partner.outputs.matched || 'false' }}" > "results/$SAFE.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ strategy.job-index }}
          path: results/*.json
          retention-days: 1

  report:
    needs: [ discover, verify ]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    runs-on: [self-hosted, java-runner]
    timeout-minutes: 10
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: result-*
          merge-multiple: true
        continue-on-error: true

      - name: Generate GitHub App token
        id: app-token
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Aggregate + report on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DISPATCH_PAT || github.token }}
          script: |
            const fs = require('fs');
            const sha = ${{ toJSON(needs.discover.outputs.consumer_sha) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let results = [];
            try {
              for (const f of fs.readdirSync('results')) {
                if (f.endsWith('.json')) results.push(JSON.parse(fs.readFileSync(`results/${f}`,'utf8')));
              }
            } catch (e) { core.info(`No result files: ${e.message}`); }

            const failed = results.filter(r => r.outcome !== 'success');
            const passed = results.filter(r => r.outcome === 'success');
            const noProviders = results.length === 0;
            const success = failed.length === 0;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: success ? 'success' : 'failure',
              context: 'contract-verification',
              target_url: runUrl,
              description: noProviders ? 'No upstream providers resolved'
                : (success ? `Passes against ${passed.length} provider(s)` : `${failed.length} provider(s) failing`),
            });

            if (!context.payload.pull_request) return;

            const marker = '<!-- contract-verification:upstream -->';
            const refOf = r => r.matched ? ` — matched branch \`${r.ref}\`` : (r.ref ? ` — \`${r.ref}\`` : '');
            const line = r => `- ${r.outcome === 'success' ? '✅' : '❌'} \`${r.repo}\`${refOf(r)} ([job](${r.job_url}))`;
            let body = `${marker}\n### Contract verification — upstream providers\n`;
            if (noProviders) {
              body += `No upstream providers resolved from application.yml. Nothing to verify.\n`;
            } else if (success) {
              body += `✅ **Consumer PR \`${sha.substring(0,7)}\` passes** against all ${passed.length} provider(s).\n\n` +
                      passed.map(line).join('\n');
            } else {
              body += `❌ **Breaking change** — consumer PR \`${sha.substring(0,7)}\` fails against ${failed.length} provider(s):\n\n` +
                      failed.map(line).join('\n') +
                      (passed.length ? `\n\nPassing:\n` + passed.map(line).join('\n') : '');
            }
            body += `\n\n[Verification run](${runUrl})`;

            const pr = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment(
              { owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment(
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });

            if (!success) core.setFailed(`${failed.length} provider(s) failing`);
